syntax = "proto3";

package processor.v1;

import "config/v1/parameter.proto";
import "opencdc/v1/opencdc.proto";
import "opencdc/v2/opencdc.proto";

message CommandRequest {
  oneof request {
    Specify.Request specify = 1;
    Configure.Request configure = 2;
    Open.Request open = 3;
    Process.Request process = 4;
    Teardown.Request teardown = 5;
  }
}
message CommandResponse {
  oneof response {
    Error error = 1;

    Specify.Response specify = 2;
    Configure.Response configure = 3;
    Open.Response open = 4;
    Process.Response process = 5;
    Teardown.Response teardown = 6;
  }
}

message Specify {
  message Request {}
  message Response {
    // Name is the name of the plugin.
    string name = 1;
    // Summary is a brief description of the plugin and what it does,
    // ideally not longer than one sentence.
    string summary = 2;
    // Description is a longer form field, appropriate for README-like
    // text that the author can provide for documentation about the
    // usage of the plugin.
    string description = 3;
    // Version string. Should follow semantic versioning and use the "v"
    // prefix (e.g. v1.23.4).
    string version = 4;
    // Author declares the entity that created or maintains this plugin.
    string author = 5;
    // A map that describes parameters available for configuring the
    // processor plugin.
    map<string, config.v1.Parameter> parameters = 6;
    // Stateless declares that the processor keeps no state between calls, so
    // the engine may run its stage concurrently and may reorder which instance
    // handles which record. A processor that does not set this is treated as
    // stateful and run serially.
    bool stateless = 7;
    // StructuredValuesV2 declares that the processor supports opencdc.v2
    // records, which carry int64, uint64, bytes and decimal values losslessly
    // (see ADR 20261015-lossless-structured-values-protocol-v3.md). The host
    // sends the v2 record fields of Process only to a processor that sets this.
    // An old host leaves it at its proto3 default (false) and never sends a v2
    // record.
    bool structured_values_v2 = 8;
  }
}

message Configure {
  message Request {
    map<string, string> parameters = 1;
  }

  message Response {}
}

message Open {
  message Request {}
  message Response {}
}

message Process {
  message Request {
    // Records carries the opencdc.v1 representation of the input records. The
    // host sets this for a processor that did not declare structured_values_v2.
    repeated opencdc.v1.Record records = 1;
    // RecordsV2 carries the opencdc.v2 representation of the input records. The
    // host sets this — and leaves records unset — only for a processor that
    // declared structured_values_v2. An old guest never receives this field.
    repeated opencdc.v2.Record records_v2 = 2;
  }
  message Response {
    repeated ProcessedRecord records = 1;
  }

  message ProcessedRecord {
    oneof record {
      opencdc.v1.Record single_record = 1;
      FilterRecord filter_record = 2;
      ErrorRecord error_record = 3;
      MultiRecord multi_record = 4;
      // SingleRecordV2 is the opencdc.v2 representation of a single processed
      // record, used by a guest that declared structured_values_v2.
      opencdc.v2.Record single_record_v2 = 5;
      // MultiRecordV2 is the opencdc.v2 representation of a fan-out result,
      // used by a guest that declared structured_values_v2.
      MultiRecordV2 multi_record_v2 = 6;
    }
  }

  message FilterRecord {}
  message ErrorRecord {
    Error error = 1;
  }
  message MultiRecord {
    repeated opencdc.v1.Record records = 1;
  }
  message MultiRecordV2 {
    repeated opencdc.v2.Record records = 1;
  }
}

message Teardown {
  message Request {}
  message Response {}
}

message Error {
  uint32 code = 1;
  string message = 2;
}
