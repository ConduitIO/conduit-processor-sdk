# This action automatically merges dependabot PRs that update go dependencies (only patch and minor updates).
# Based on: https://docs.github.com/en/code-security/supply-chain-security/keeping-your-dependencies-updated-automatically/automating-dependabot-with-github-actions#enable-auto-merge-on-a-pull-request
#
# EXCLUDED DEPS: load-bearing dependencies never auto-merge. Bumps to these
# need a human review because they sit under record serialization or the
# host/guest wire format. Same approach as ConduitIO/conduit-commons#281 and
# ConduitIO/conduit#2890.
#
# Why this exists: #165 (goccy/go-json 0.10.6 -> 0.11.2, a decoder/encoder
# rewrite that changes output bytes and error messages) was approved and
# merged by this workflow with no human looking at it.
#
# Exact module paths:
#   google.golang.org/protobuf - host/guest wire format (proto/procutils,
#                                processor protocol messages)
#   github.com/goccy/go-json   - opencdc record JSON (via conduit-commons);
#                                the version this go.mod requires is the
#                                minimum every processor built on the SDK
#                                gets, so a bump here changes their output
# Prefixes (any module path that starts with these):
#   github.com/conduitio/      - conduit-commons (records, schema, config)
#                                and any other conduitio module
#
# A grouped PR is excluded if ANY dependency in it matches. Excluded PRs get
# a comment saying so and wait for a human to review and merge them.

name: Dependabot auto-merge
on:
  pull_request:
    # Run this action when dependabot labels the PR, we care about the 'go' label.
    types: [labeled]

permissions:
  pull-requests: write
  contents: write

jobs:
  dependabot-go:
    runs-on: ubuntu-latest
    if: ${{ github.actor == 'dependabot[bot]' && contains(github.event.pull_request.labels.*.name, 'go') }}
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2.4.0
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Check exclusion list
        id: excluded
        env:
          NAMES: ${{ steps.metadata.outputs.dependency-names }}
          EXCLUDED_EXACT: "google.golang.org/protobuf,github.com/goccy/go-json"
          EXCLUDED_PREFIX: "github.com/conduitio/"
        run: |
          set -euo pipefail
          excluded="false"
          IFS=',' read -ra names <<< "$NAMES"
          IFS=',' read -ra exact <<< "$EXCLUDED_EXACT"
          IFS=',' read -ra prefix <<< "$EXCLUDED_PREFIX"
          for n in "${names[@]}"; do
            n="${n// /}"
            for b in "${exact[@]}"; do
              [ "$n" = "$b" ] && excluded="true"
            done
            for p in "${prefix[@]}"; do
              [[ "$n" == "$p"* ]] && excluded="true"
            done
          done
          # Fail closed: if fetch-metadata gave us no names we cannot tell
          # what is being bumped, so do not auto-merge it.
          [ "${#names[@]}" -eq 0 ] && excluded="true"
          echo "excluded=$excluded" >> "$GITHUB_OUTPUT"

      - name: Comment on excluded PR
        if: ${{ steps.excluded.outputs.excluded == 'true' }}
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEP_NAMES: ${{ steps.metadata.outputs.dependency-names }}
        run: |
          gh pr comment "$PR_URL" --body "Not auto-merging: \`${DEP_NAMES}\` is on the load-bearing exclusion list in dependabot-auto-merge-go.yml (record serialization or host/guest wire format). Needs a human review."

      - name: Approve PR
        # Approve only patch and minor updates, and never excluded deps
        if: ${{ steps.metadata.outputs.update-type != 'version-update:semver-major' && steps.excluded.outputs.excluded == 'false' }}
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge for Dependabot PRs
        # Enable auto-merging only for patch and minor updates, and never excluded deps
        if: ${{ steps.metadata.outputs.update-type != 'version-update:semver-major' && steps.excluded.outputs.excluded == 'false' }}
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
